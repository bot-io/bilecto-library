# Deploys the generated library content (committed by publish.mjs) to GitHub Pages.
# Owner enabled Pages on this repo 2026-10-29; no internal pages-build-deployment
# run ever fired, so the site is configured for the "GitHub Actions" build type —
# this workflow is that deploy path. Idempotent: safe to run on every nightly push.
name: Deploy library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site (exclude VCS metadata)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
